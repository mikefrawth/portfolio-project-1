<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchViz — CloudFormation Diagram Generator</title>
  </head>
  <body>
    <!--
      Vite + React uses a single <div id="root"> as the mount point.
      React renders the entire app inside this element (this is called
      a Single Page Application, or SPA).
    -->
    <div id="root"></div>
    <!--
      /src/main.tsx is the JavaScript entry point.
      type="module" enables ES module syntax (import/export) natively in the browser.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
